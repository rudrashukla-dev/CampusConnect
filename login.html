<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login page</title>
    <link rel="stylesheet" href="style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Lato:ital,wght@0,300;0,400;0,700;0,900;1,400;1,700&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.1/css/all.min.css"
        integrity="sha512-QeR2VH+lsBE5LSAe1Q5EnTBbe7XTBubt8dG93Y7gidSgdMCr8nVqKcfKAMyN96SV8KDbZVTDXChatu5G2KQGzg=="
        crossorigin="anonymous" referrerpolicy="no-referrer">
</head>

<body class="login-page">

    <div class="login-container">

        <div class="branding-section">
            <p class="brand-label">CAMPUSCONNECT</p>
            <h2>Connect. Learn. Build Together.</h2>
            <p>Find students with skills and interests that match your learning or project goals.</p>
        </div>

        <div class="login-content">
            <h1 class="login-heading">Welcome back!</h1>

            <form action="#">
                <div class="mail">
                    <label for="email" class="lab">Email:</label>
                    <input type="email" id="email" placeholder="Please enter your email" name="mail">
                </div>

                <div class="pass">
                    <label for="pass" class="lab">Password:</label>
                    <input type="password" id="pass" placeholder="Please enter your password" name="password">
                </div>

                <div class="submit">
                    <button type="submit" class="submit-btn">Login</button>
                </div>

                <div class="options">
                    <p>Don't have an account?</p>
                    <a href="#" id="register">Register</a>
                </div>
            </form>
        </div>

    </div>

</body>

</html>
